# Include внутрь VirtualHost public.lan (см. deploy/setup-local.sh)
# LAN: http://public.lan/crm_fr  |  API: http://public.lan/crm_fr/api → crm.public.lan
# Аналог prod: https://podzamenu.ru/crm_fr

    ProxyPreserveHost Off

    # /crm_fr/api/* → crm.public.lan/* (same-origin cookie-сессия)
    ProxyPass /crm_fr/api/ http://crm.public.lan/
    ProxyPassReverse /crm_fr/api/ http://crm.public.lan/
    ProxyPassReverseCookieDomain crm.public.lan public.lan
    ProxyPassReverseCookiePath / /

    <Location /crm_fr/api/>
        Header edit Set-Cookie "(?i);\s*Domain=[^;]*" ""
        Header edit Set-Cookie "(?i);\s*Secure" ""
        Header edit Set-Cookie "(?i);\s*SameSite=None" "; SameSite=Lax"
    </Location>

    Alias /crm_fr /var/www/podzamenu/crm-frontend-franchising/dist
    <Directory /var/www/podzamenu/crm-frontend-franchising/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /crm_fr/index.html
    </Directory>

    <Directory /var/www/podzamenu/crm-frontend-franchising/dist/assets>
        FallbackResource disabled
    </Directory>
