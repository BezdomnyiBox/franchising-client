# Пример gateway для prod / staging (фрагмент server { ... } на podzamenu.ru)
#
# SPA:  https://podzamenu.ru/crm_fr
# API:  https://podzamenu.ru/crm_fr/api/* → https://back.podzamenu.ru/*
# CRM:  https://podzamenu.ru/crm (отдельное приложение)
#
# Тест: proxy_pass http://backtest.podzamenu.ru/;

    location /crm_fr/api/ {
        proxy_pass https://back.podzamenu.ru/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_domain back.podzamenu.ru .podzamenu.ru;
        proxy_cookie_path / /;
    }

    location /crm_fr/ {
        alias /var/www/podzamenu/crm-frontend-franchising/dist/;
        try_files $uri $uri/ /crm_fr/index.html;
    }
