# Пример для nginx: public.lan (рядом с /crm)
# /crm_fr + /crm_fr/api → бэкенд crm.public.lan

    location /crm_fr/api/ {
        proxy_pass http://crm.public.lan/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_domain crm.public.lan public.lan;
        proxy_cookie_path / /;
    }

    location /crm_fr/assets/ {
        alias /var/www/podzamenu/crm-frontend-franchising/dist/assets/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /crm_fr/ {
        alias /var/www/podzamenu/crm-frontend-franchising/dist/;
        try_files $uri $uri/ /crm_fr/index.html;
    }
