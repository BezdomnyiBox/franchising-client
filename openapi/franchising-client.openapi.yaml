openapi: 3.1.0
info:
  title: Franchising Client API
  version: 0.2.0
  description: |
    API для менеджера франшизы (ПВ). Логика совпадает с CRM franchising,
    но доступ ограничен своим пунктом выдачи и своими заказами.

    Контракт зафиксирован для согласования с бэкендом.
    Часть путей уже существует в CRM; поля scope/enforce — требования к hardening.

    ## Auth (отдельно от сайта/CRM)
    Cookie `franchising_auth` (HttpOnly, HMAC). Не использует `/login_user` и cookie `user`.
    Логин: `POST /franchising/auth/login` JSON `{ phone, password }`.
    Только роль `franchising` или manager с `branchId`.
    `GET /franchising/auth/me` — текущий пользователь.
    Logout: `POST /franchising/auth/logout`.
    Для существующих order/search API CRM request-bridge мапит валидный
    `franchising_auth` → in-memory cookie `user` на время запроса (старая логика не меняется).

    ## Enforce ПВ (обязательно на сервере)
    1. Пользователь с ролью franchising (или эквивалент) и `manager.branchId`.
    2. `GET /order/list` — всегда фильтр по session.branchId; `selectedBranch` от клиента игнорировать.
    3. `POST /order/create_by_franchising` — `branchId`/`userId` только из сессии.
    4. Любой `/order/{orderId}*` — если order.branchId ≠ session.branchId → 403
       (не 404, чтобы фронт отличал «чужой» от «нет»).
    5. Поиск/add_element — только в заказ своего ПВ.
    6. Запретить повышение прав через подмену branchId в теле/query.

servers:
  - url: /crm_fr/api
    description: Same-origin gateway (Vite / Apache / Nginx → backend)

tags:
  - name: Auth
  - name: Orders
  - name: Search
  - name: OrderElements

paths:
  /franchising/auth/login:
    post:
      tags: [Auth]
      summary: Логин менеджера ПВ (отдельный от сайта/CRM)
      operationId: franchisingLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  description: 10 цифр без +7/8
                password: { type: string }
      responses:
        '200':
          description: OK + Set-Cookie HttpOnly `franchising_auth`
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, example: success }
                  authVersion: { type: integer, example: 1 }
                  cookieName: { type: string, example: franchising_auth }
                  error: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /franchising/auth/logout:
    post:
      tags: [Auth]
      summary: Выход (очистка cookie franchising_auth)
      operationId: franchisingLogout
      responses:
        '200':
          description: OK + Set-Cookie clear

  /franchising/auth/me:
    get:
      tags: [Auth]
      summary: Текущий менеджер ПВ (franchising auth)
      operationId: franchisingMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FranchiseUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/crm_info:
    get:
      tags: [Auth]
      summary: Текущий пользователь менеджера франшизы
      operationId: getCurrentUser
      description: |
        Клиент считает сессию валидной только если есть непустой `permissions.pages`.
        Для franchising-клиента дополнительно ожидается роль/признак ПВ и manager.branchId.
      responses:
        '200':
          description: OK (или «гость» без permissions — legacy CRM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FranchiseUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /order/list:
    get:
      tags: [Orders]
      summary: Список заказов текущего ПВ
      operationId: listOrders
      description: |
        Сервер ОБЯЗАН игнорировать selectedBranch от клиента (или принимать только свой branchId)
        и возвращать только заказы ПВ текущего менеджера.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: phone
          in: query
          schema: { type: string }
        - name: customer
          in: query
          schema: { type: string }
        - name: article
          in: query
          schema: { type: string }
        - name: car
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: priceFrom
          in: query
          schema: { type: string }
        - name: priceTo
          in: query
          schema: { type: string }
        - name: withoutInnerOrders
          in: query
          schema: { type: integer, enum: [1], default: 1 }
      responses:
        '200':
          description: |
            Legacy CRM shape: map status -> { orders: OrderListItem[] }
            либо плоский массив OrderListItem[] (предпочтительно для нового клиента).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/OrderListItem'
                  - type: object
                    additionalProperties:
                      type: object
                      properties:
                        orders:
                          type: array
                          items:
                            $ref: '#/components/schemas/OrderListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/create_by_franchising:
    post:
      tags: [Orders]
      summary: Создать заказ от менеджера франшизы
      operationId: createFranchisingOrder
      description: |
        branchId и userId берутся из сессии на сервере (не доверять телу запроса).
        warehouseId — склад назначения (Владивосток / ответхранение), если поддерживается.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateFranchisingOrderRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFranchisingOrderRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [orderId]
                properties:
                  orderId:
                    type: integer
                    description: Internal order id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}:
    get:
      tags: [Orders]
      summary: Карточка заказа
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /order/{orderId}/elements_for_manager_order_interface:
    get:
      tags: [OrderElements]
      summary: Позиции заказа для интерфейса менеджера
      operationId: getOrderElements
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [elements]
                properties:
                  elements:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderElement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/add_element:
    post:
      tags: [OrderElements]
      summary: Добавить позицию в заказ
      operationId: addOrderElement
      description: |
        Как в CRM SearchContainer.addItemToOrder.
        Пустая строка (FR-S1-02 / ElementsList.addElement): тело без itemId.
        Сервер обязан проверить, что order принадлежит ПВ менеджера.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId: { type: integer }
                quantity: { type: number, default: 1 }
                searchProductId:
                  oneOf:
                    - { type: integer }
                    - { type: 'null' }
                our_products_in_search_result:
                  type: array
                  items: {}
                is_margin: { type: boolean, default: false }
                lineNumber: { type: integer, default: 0 }
            examples:
              withOffer:
                summary: Добавление оффера из поиска
                value:
                  itemId: 123
                  quantity: 1
              blankRow:
                summary: Пустая строка позиции
                value: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderElementId: { type: integer }
                  result: { type: string }
                  message: { type: string }
                  error: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/confirm:
    post:
      tags: [Orders]
      summary: Подтвердить заказ
      operationId: confirmOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assemblyTime]
              properties:
                assemblyTime:
                  type: string
                  description: 'YYYY-MM-DD HH:mm:ss'
                  example: '2026-08-12 18:00:00'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order_element/{elementId}/cancel:
    post:
      tags: [OrderElements]
      summary: Отменить позицию заказа
      operationId: cancelOrderElement
      parameters:
        - $ref: '#/components/parameters/OrderElementId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order_element/{elementId}/quantity:
    patch:
      tags: [OrderElements]
      summary: Изменить количество позиции
      operationId: patchOrderElementQuantity
      parameters:
        - $ref: '#/components/parameters/OrderElementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderElementValueNumber'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order_element/{elementId}/retail_price_by_admin:
    patch:
      tags: [OrderElements]
      summary: Изменить розничную цену (рубли)
      operationId: patchOrderElementRetailPrice
      parameters:
        - $ref: '#/components/parameters/OrderElementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderElementValueNumber'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order_element/{elementId}/description:
    patch:
      tags: [OrderElements]
      summary: Изменить наименование позиции
      operationId: patchOrderElementDescription
      parameters:
        - $ref: '#/components/parameters/OrderElementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderElementValueString'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order_element/{elementId}/weight:
    patch:
      tags: [OrderElements]
      summary: Изменить вес позиции
      operationId: patchOrderElementWeight
      parameters:
        - $ref: '#/components/parameters/OrderElementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderElementValueNumber'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/copy/{orderId}:
    post:
      tags: [Orders]
      summary: Скопировать заказ
      operationId: copyOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [withElements, isManagerSource]
              properties:
                withElements:
                  type: boolean
                  description: Копировать позиции заказа
                isManagerSource:
                  type: boolean
                  description: Источник — менеджер (всегда true для CRM/франшизы)
                  enum: [true]
      responses:
        '200':
          description: OK — orderId = публичный номер нового заказа
          content:
            application/json:
              schema:
                type: object
                required: [orderId]
                properties:
                  orderId:
                    type: integer
                    description: Публичный номер нового заказа (getNumber)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/field_data/transport_company:
    get:
      tags: [Orders]
      summary: Список транспортных компаний для заказа
      operationId: getOrderTransportCompanies
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [list]
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransportCompanyOption'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/change_transport_company:
    post:
      tags: [Orders]
      summary: Сменить транспортную компанию
      operationId: changeOrderTransportCompany
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias]
              properties:
                alias:
                  type: string
                  description: Alias ТК из field_data/transport_company
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/add_comment:
    post:
      tags: [Orders]
      summary: Добавить комментарий к заказу
      operationId: addOrderComment
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment, type]
              properties:
                comment:
                  type: string
                type:
                  type: string
                  enum: [personal, collective]
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/order_elements_with_not_confirmed_weight:
    get:
      tags: [Orders]
      summary: Позиции с неподтверждённым весом
      operationId: getOrderElementsWithNotConfirmedWeight
      description: |
        Если массив не пуст — notify_customer вызывать нельзя (как CRM notifyCustomer).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK — список описаний позиций
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/notify_customer:
    post:
      tags: [Orders]
      summary: Оповестить клиента (SMS)
      operationId: notifyCustomer
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/formed_print:
    post:
      tags: [Orders]
      summary: Сформировать счёт (printHash)
      operationId: formedPrintOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hideArticle]
              properties:
                hideArticle:
                  type: boolean
      responses:
        '200':
          description: OK — после вызова в заказе появляется printHash
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/send_print:
    post:
      tags: [Orders]
      summary: Отправить счёт на email клиента
      operationId: sendPrintOrder
      description: Требует customerEmail и printHash на заказе.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/change_client_source:
    post:
      tags: [Orders]
      summary: Сменить источник обращения
      operationId: changeOrderClientSource
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSource]
              properties:
                clientSource:
                  type: string
                  description: alias из user.manager.accessibleClientSources
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/check_elements_by_api:
    post:
      tags: [Orders]
      summary: Проверить наличие позиций у поставщиков
      operationId: checkElementsByApi
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  emptyOrderElementItem:
                    type: array
                    items: { type: string }
                  canceledOrderElementItem:
                    type: array
                    items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/add_notification:
    post:
      tags: [Orders]
      summary: Создать напоминание по заказу
      operationId: addOrderNotification
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [showDate, comment]
              properties:
                messageId:
                  type: integer
                  default: 1
                showDate:
                  type: string
                  description: 'YYYY-MM-DD HH:mm:00'
                comment:
                  type: string
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order/{orderId}/customers_orders:
    get:
      tags: [Orders]
      summary: История заказов клиента по VIN или телефону
      operationId: fetchCustomerOrdersHistory
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [vin, phone]
      responses:
        '200':
          description: Список прошлых заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOrderHistoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /order_element/{elementId}/confirm_weight:
    patch:
      tags: [OrderElements]
      summary: Подтвердить вес позиции
      operationId: confirmOrderElementWeight
      parameters:
        - $ref: '#/components/parameters/OrderElementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: integer
                  enum: [1]
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bookkeeping/print_cashier_order/{orderId}:
    get:
      tags: [Orders]
      summary: Печать кассового ордера
      operationId: printCashierOrder
      description: |
        Открывается через window.open (same-origin cookie сессии /crm_fr).
        URL: {API_BASE_URL}/bookkeeping/print_cashier_order/{orderId}
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: HTML/PDF документ
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /public_invoice/{printHash}:
    get:
      tags: [Orders]
      summary: Публичная ссылка на сформированный счёт
      operationId: getPublicInvoice
      parameters:
        - name: printHash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML счёта
        '404':
          $ref: '#/components/responses/NotFound'

  /product/tips:
    get:
      tags: [Search]
      summary: Подсказки по артикулу
      operationId: getProductTips
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/ProductTip'
                  - type: object
                    properties:
                      tips:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductTip'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /product/search/{productId}:
    get:
      tags: [Search]
      summary: Предложения / наличие по продукту
      operationId: searchProductOffers
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - name: orderId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          deprecated: true
          description: Не передавать с клиента; брать из сессии
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/ProductOffer'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: |
        Internal id. Публичный номер в UI = orderId - 40777.
        Сервер обязан проверить принадлежность заказа ПВ текущего менеджера.
      schema:
        type: integer
    OrderElementId:
      name: elementId
      in: path
      required: true
      description: Internal id позиции заказа (order_element).
      schema:
        type: integer
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date

  responses:
    Unauthorized:
      description: Нет сессии
    Forbidden:
      description: Заказ / ресурс не принадлежит ПВ менеджера
    NotFound:
      description: Не найдено
    BadRequest:
      description: Ошибка валидации

  schemas:
    OrderElementValueNumber:
      type: object
      required: [value]
      properties:
        value: { type: number }
    OrderElementValueString:
      type: object
      required: [value]
      properties:
        value: { type: string }
    FranchiseUser:
      type: object
      required: [id, roles, manager]
      properties:
        id:
          type: integer
        name:
          type: string
        roles:
          type: array
          items:
            type: string
          example: [franchising]
        manager:
          type: object
          required: [branchId]
          properties:
            branchId:
              type: integer
            branchName:
              type: string

    OrderStatus:
      type: string
      enum:
        - accepted
        - collected
        - packed
        - confirmed
        - notified_customer
        - issued
        - canceled

    OrderListItem:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        number:
          oneOf:
            - { type: integer }
            - { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'
        statusDescription: { type: string }
        createdAt: { type: string }
        createdDate: { type: string }
        customerFullName: { type: string }
        customerName: { type: string }
        phone: { type: string }
        fullCar: { type: string }
        car: { type: string }
        price:
          type: number
          description: Сумма в копейках
        totalPrice: { type: number }
        workManagerName: { type: string }
        branchId: { type: integer }
        statusesHistory:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              date: { type: string }
              color: { type: string }
        comments:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              text: { type: string }
        refusingReason:
          oneOf:
            - { type: string }
            - { type: 'null' }

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderListItem'
        - type: object
          properties:
            firstName: { type: string }
            lastName: { type: string }
            fatherName: { type: string }
            email: { type: string }
            customerEmail: { type: string }
            carBrand: { type: string }
            carModel: { type: string }
            carVin: { type: string }
            comment: { type: string }
            clientSource: { type: string }
            transportCompanyAlias: { type: string }
            transportCompanyPrice: { type: number }
            printHash:
              oneOf:
                - { type: string }
                - { type: 'null' }
            personalComments:
              type: array
              items:
                $ref: '#/components/schemas/OrderComment'
            collectiveComments:
              type: array
              items:
                $ref: '#/components/schemas/OrderComment'

    OrderComment:
      type: object
      properties:
        manager: { type: string }
        date: { type: string }
        comment: { type: string }

    TransportCompanyOption:
      type: object
      required: [id, alias, name]
      properties:
        id: { type: integer }
        alias: { type: string }
        name: { type: string }
        price: { type: number }

    OrderElement:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        article: { type: string }
        brand: { type: string }
        name: { type: string }
        quantity: { type: number }
        price: { type: number }
        status: { type: string }
        weight: { type: number }
        description: { type: string }
        isWeightConfirmed: { type: boolean }
        diffOfferTimeDays: { type: number }

    CustomerOrderHistoryItem:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        number:
          oneOf:
            - { type: integer }
            - { type: string }
        acceptedDate: { type: string }
        issueDate: { type: string }
        elements:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              offerBrand: { type: string }
              offerArt: { type: string }
              name: { type: string }
              quantity: { type: number }
              status: { type: string }

    CreateFranchisingOrderRequest:
      type: object
      required: [firstName, phone]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        fatherName: { type: string }
        phone: { type: string }
        email: { type: string }
        carBrand: { type: string }
        carModel: { type: string }
        carVin: { type: string }
      description: |
        ПВ (branch) берётся из менеджера сессии на бэкенде.
        Поле warehouseId/branchId с клиента не требуется.

    ProductTip:
      type: object
      required: [id, article]
      properties:
        id: { type: integer }
        article: { type: string }
        brand: { type: string }
        name: { type: string }

    ProductOffer:
      type: object
      required: [id, article]
      properties:
        id: { type: integer }
        article: { type: string }
        brand: { type: string }
        name: { type: string }
        price: { type: number }
        quantity: { type: number }
        deliveryDays: { type: number }
        warehouseName: { type: string }
